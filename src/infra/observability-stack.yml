services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: otel_config
        target: /etc/otel/config.yaml
    command: ["--config=/etc/otel/config.yaml"]
    networks:
      - persistence

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - persistence

  promtail:
    image: grafana/promtail:3.5.8
    container_name: promtail
    restart: unless-stopped
    user: root
    ports:
      - "9080:9080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - persistence

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
      - "4319:4317"
    volumes:
      - tempo_data:/var/tempo
    configs:
      - source: tempo_config
        target: /etc/tempo/config.yaml
    command: ["-config.file=/etc/tempo/config.yaml"]
    networks:
      - persistence

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor correlations
    volumes:
      - grafana_data:/var/lib/grafana
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yaml
      - source: grafana_dashboard_json
        target: /etc/grafana/provisioning/dashboards/homelab.json
    depends_on:
      - loki
      - tempo
    networks:
      - persistence

volumes:
  loki_data:
  grafana_data:
  tempo_data:

networks:
  persistence:
    external: true

configs:
  otel_config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch:
          timeout: 5s

      exporters:
        otlphttp/tempo:
          endpoint: http://tempo:4317
          tls:
            insecure: true

        otlphttp/loki:
          endpoint: http://loki:3100/otlp
          tls:
            insecure: true

        debug:
          verbosity: basic

      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp/tempo, debug]
          logs:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlphttp/loki, debug]

  promtail_config:
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0

      positions:
        filename: /tmp/positions.yaml

      clients:
        - url: http://loki:3100/loki/api/v1/push

      scrape_configs:
        - job_name: containers
          docker_sd_configs:
            - host: unix:///var/run/docker.sock
              refresh_interval: 5s
          relabel_configs:
            - source_labels: [__meta_docker_container_name]
              regex: "/(.*)"
              target_label: container
            - source_labels: [__meta_docker_container_label_com_docker_compose_service]
              target_label: compose_service
            - source_labels: [__meta_docker_container_label_com_docker_compose_project]
              target_label: compose_project
            - source_labels: [compose_project, compose_service]
              separator: "/"
              target_label: service_name
            - source_labels: [container]
              regex: ".+"
              action: keep


  tempo_config:
    content: |
      stream_over_http_enabled: true

      server:
        http_listen_port: 3200
        log_level: info

      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318

      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/blocks
          wal:
            path: /var/tempo/wal

  grafana_datasources:
    content: |
      apiVersion: 1

      datasources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki:3100
          access: proxy
          isDefault: false
          jsonData:
            derivedFields:
              - name: TraceID
                matcherRegex: '"trace_id"\s*:\s*"(\w+)"'
                url: '$${__value.raw}'
                datasourceUid: tempo
                urlDisplayLabel: "View Trace"

        - name: Tempo
          type: tempo
          uid: tempo
          url: http://tempo:3200
          access: proxy
          isDefault: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: "-1m"
              spanEndTimeShift: "1m"
              filterByTraceID: true
              filterBySpanID: false
              customQuery: true
              query: '{container="$${__span.tags[\"service.name\"]}"} |= "$${__trace.traceId}"'
            nodeGraph:
              enabled: true
            lokiSearch:
              datasourceUid: loki

        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://otel-collector:8888/metrics
          access: proxy
          isDefault: true

  grafana_dashboards_provider:
    content: |
      apiVersion: 1

      providers:
        - name: default
          folder: Homelab
          type: file
          options:
            path: /etc/grafana/provisioning/dashboards

  grafana_dashboard_json:
    content: |
      {
        "title": "faasd — observability",
        "uid": "faasd-observability",
        "tags": ["faasd", "observability"],
        "editable": true,
        "schemaVersion": 39,
        "refresh": "30s",
        "time": { "from": "now-1h", "to": "now" },
        "timezone": "browser",
        "templating": {
          "list": [
            {
              "name": "function",
              "label": "Função",
              "type": "query",
              "datasource": { "type": "loki", "uid": "loki" },
              "query": "label_values({job=\"faasd\"}, function_name)",
              "includeAll": true,
              "allValue": ".*",
              "refresh": 2,
              "sort": 1,
              "hide": 0
            },
            {
              "name": "compose_project",
              "label": "Projeto Docker",
              "type": "query",
              "datasource": { "type": "loki", "uid": "loki" },
              "query": "label_values({job=\"containers\"}, compose_project)",
              "includeAll": true,
              "allValue": ".*",
              "refresh": 2,
              "sort": 1,
              "hide": 0
            }
          ]
        },
        "panels": [
          {
            "id": 1, "type": "row", "title": "🔭 Traces — Tempo",
            "collapsed": false, "description": "",
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
          },
          {
            "id": 2, "type": "timeseries", "title": "Rate de spans por serviço",
            "description": "",
            "datasource": { "type": "tempo", "uid": "tempo" },
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
            "targets": [{ "queryType": "traceql", "query": "{ } | rate()", "legendFormat": "{{.resource.service.name}}" }]
          },
          {
            "id": 3, "type": "timeseries", "title": "Erros de trace por serviço",
            "description": "",
            "datasource": { "type": "tempo", "uid": "tempo" },
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
            "targets": [{ "queryType": "traceql", "query": "{ status = error } | rate()", "legendFormat": "{{.resource.service.name}}" }]
          },
          {
            "id": 4, "type": "row", "title": "📋 Logs — Funções faasd",
            "collapsed": false, "description": "",
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 }
          },
          {
            "id": 5, "type": "timeseries", "title": "Volume de logs por função",
            "description": "",
            "datasource": { "type": "loki", "uid": "loki" },
            "gridPos": { "h": 6, "w": 12, "x": 0, "y": 10 },
            "targets": [{ "expr": "sum(count_over_time({job=\"faasd\"}[1m])) by (function_name)", "legendFormat": "{{function_name}}" }]
          },
          {
            "id": 6, "type": "timeseries", "title": "Erros por função",
            "description": "",
            "datasource": { "type": "loki", "uid": "loki" },
            "gridPos": { "h": 6, "w": 12, "x": 12, "y": 10 },
            "targets": [{ "expr": "sum(count_over_time({job=\"faasd\"} |= \"error\" [1m])) by (function_name)", "legendFormat": "{{function_name}}" }]
          },
          {
            "id": 7, "type": "logs", "title": "Logs — $function",
            "description": "",
            "datasource": { "type": "loki", "uid": "loki" },
            "gridPos": { "h": 10, "w": 24, "x": 0, "y": 16 },
            "options": { "dedupStrategy": "none", "enableLogDetails": true, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true },
            "targets": [{ "expr": "{job=\"faasd\", function_name=~\"$function\"}" }]
          },
          {
            "id": 10, "type": "row", "title": "🐳 Logs — Containers Docker",
            "collapsed": false, "description": "",
            "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 }
          },
          {
            "id": 11, "type": "timeseries", "title": "Volume por projeto",
            "description": "",
            "datasource": { "type": "loki", "uid": "loki" },
            "gridPos": { "h": 6, "w": 12, "x": 0, "y": 27 },
            "targets": [{ "expr": "sum(count_over_time({job=\"containers\"}[1m])) by (compose_project)", "legendFormat": "{{compose_project}}" }]
          },
          {
            "id": 12, "type": "timeseries", "title": "Erros por serviço",
            "description": "",
            "datasource": { "type": "loki", "uid": "loki" },
            "gridPos": { "h": 6, "w": 12, "x": 12, "y": 27 },
            "targets": [{ "expr": "sum(count_over_time({job=\"containers\"} |= \"error\" [1m])) by (compose_service)", "legendFormat": "{{compose_service}}" }]
          },
          {
            "id": 13, "type": "logs", "title": "Logs — $compose_project",
            "description": "",
            "datasource": { "type": "loki", "uid": "loki" },
            "gridPos": { "h": 10, "w": 24, "x": 0, "y": 33 },
            "options": { "dedupStrategy": "none", "enableLogDetails": true, "showLabels": true, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true },
            "targets": [{ "expr": "{job=\"containers\", compose_project=~\"$compose_project\"}" }]
          },
          {
            "id": 14, "type": "logs", "title": "Erros — todos os containers",
            "description": "",
            "datasource": { "type": "loki", "uid": "loki" },
            "gridPos": { "h": 10, "w": 24, "x": 0, "y": 43 },
            "options": { "dedupStrategy": "none", "enableLogDetails": true, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true },
            "targets": [{ "expr": "{job=\"containers\"} |= \"error\"" }]
          }
        ]
      }
