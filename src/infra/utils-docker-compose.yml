services:
  gateway:
    image: re.giomartins.dev/gateway:latest
    ports:
      - "3002:3000"
    environment:
      FAAS_GATEWAY_URL: https://of.giomartins.dev
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET}
      PORT: 3000
    restart: unless-stopped

  gio-faas-dashboard:
    image: re.giomartins.dev/gio-faas-dashboard:latest
    ports:
      - "8079:80"
    restart: unless-stopped

  amqp-bridge:
    image: re.giomartins.dev/amqp-bridge:latest
    container_name: evolution-amqp-bridge
    restart: unless-stopped
    environment:
      - RABBITMQ_URI=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
      - RABBITMQ_EXCHANGE_NAME=${RABBITMQ_EXCHANGE_NAME}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - FUNCTION_URL=${FUNCTION_URL}
