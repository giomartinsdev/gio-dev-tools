services:
  gateway:
    image: re.giomartins.dev/gateway:latest
    ports:
      - "3002:3000"
    environment:
      FAAS_GATEWAY_URL: https://of.giomartins.dev
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET}
      PORT: 3000
    restart: unless-stopped

  gio-dev-tools:
    image: re.giomartins.dev/gio-faas-dashboard:latest
    ports:
      - "8079:80"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  webdav:
    image: bytemark/webdav
    environment:
      AUTH_TYPE: Digest
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
    volumes:
      - obsidian_data:/var/lib/dav
    ports:
      - "8585:80"
    restart: unless-stopped

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    restart: unless-stopped
    volumes:
      - infisical_redis_data:/data

  infisical-migration:
    image: infisical/infisical:latest-postgres
    container_name: infisical-migration
    command: npm run migration:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_CONNECTION_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/infisical
      REDIS_URL: redis://infisical-redis:6379
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      SITE_URL: ${INFISICAL_SITE_URL}

  infisical:
    image: infisical/infisical:latest-postgres
    container_name: infisical
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
      infisical-redis:
        condition: service_started
      infisical-migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DB_CONNECTION_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/infisical
      REDIS_URL: redis://infisical-redis:6379
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      SITE_URL: ${INFISICAL_SITE_URL}

volumes:
  postgres_data:
  obsidian_data:
  infisical_redis_data: