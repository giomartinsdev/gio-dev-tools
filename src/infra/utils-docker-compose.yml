services:
  gateway:
    image: re.giomartins.dev/gateway:latest
    ports:
      - "3002:3000"
    environment:
      FAAS_GATEWAY_URL: https://of.giomartins.dev
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET}
      PORT: 3000
    restart: unless-stopped

  gio-dev-tools:
    image: re.giomartins.dev/gio-faas-dashboard:latest
    ports:
      - "8079:80"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faas -d finance"]
      interval: 10s
      timeout: 5s
      retries: 5

  webdav:
    image: bytemark/webdav
    environment:
      AUTH_TYPE: Digest
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
    volumes:
      - obsidian_data:/var/lib/dav
    ports:
      - "8585:80"
    restart: unless-stopped

volumes:
  postgres_data:
  obsidian_data:
