services:
  gateway:
    image: re.giomartins.dev/gateway:latest
    container_name: gateway
    ports:
      - "3002:3000"
    environment:
      FAAS_GATEWAY_URL: https://of.giomartins.dev
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET}
      FINANCE_URL: http://finance:8000
      FINANCE_OCR_URL: http://finance-ocr:8000
      ASSET_QUOTES_URL: http://asset-quotes:8000
      PORTFOLIO_URL: http://portfolio:8000
      WHATSAPP_URL: http://whatsapp:8000
      DOMAIN_DATA_INSIGHTS_URL: http://domain-data-insights:8000
      SETTINGS_URL: http://settings:8000
      TRANSCRIPTION_URL: http://transcription:8000
      PORT: 3000
    restart: unless-stopped
    networks:
      - apis
      - persistence

  gio-dev-tools:
    image: re.giomartins.dev/gio-faas-dashboard:latest
    container_name: gio-dev-tools
    ports:
      - "8079:80"
    restart: unless-stopped
    networks:
      - persistence

  contact:
    image: re.giomartins.dev/contact:latest
    container_name: contact
    ports:
      - "8078:80"
    restart: unless-stopped
    networks:
      - persistence

  infisical-migration:
    image: infisical/infisical:latest-postgres
    container_name: infisical-migration
    command: npm run migration:latest
    environment:
      NODE_ENV: production
      DB_CONNECTION_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/infisical
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      SITE_URL: ${INFISICAL_SITE_URL}
    networks:
      - persistence

  infisical:
    image: infisical/infisical:latest-postgres
    container_name: infisical
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      - infisical-migration
    environment:
      NODE_ENV: production
      DB_CONNECTION_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/infisical
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      SITE_URL: ${INFISICAL_SITE_URL}
    networks:
      - persistence
      - apis

  9router:
    image: decolua/9router:latest
    ports:
      - "20128:20128"
    volumes:
      - "$HOME/.9router:/app/data"
    environment:
      DATA_DIR: /app/data
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom
    networks:
      - apis
      - persistence

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    ports:
      - "8787:8787"
    networks:
      - apis
      - persistence

networks:
  apis:
    external: true
  persistence:
    external: true