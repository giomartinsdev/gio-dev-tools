name: Deploy functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.changes.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detecta funções alteradas
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep '^functions/' \
            | cut -d'/' -f2 \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "functions=$CHANGED" >> $GITHUB_OUTPUT

  deploy:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.functions != '[]'
    strategy:
      matrix:
        function: ${{ fromJson(needs.detect-changes.outputs.functions) }}

    steps:
      - uses: actions/checkout@v4

      - name: Login no registry
        uses: docker/login-action@v3
        with:
          registry: re.giomartins.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Escolhe Dockerfile
        id: dockerfile
        run: |
          if [ -f "functions/${{ matrix.function }}/Dockerfile" ]; then
            echo "path=functions/${{ matrix.function }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: functions/${{ matrix.function }}
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: re.giomartins.dev/${{ matrix.function }}:latest

      - name: Instala faas-cli
        run: curl -sSL https://cli.openfaas.com | sudo sh

      - name: Login no faasd
        run: |
          echo ${{ secrets.OPENFAAS_PASSWORD }} | faas-cli login -s \
            --gateway ${{ secrets.OPENFAAS_URL }}

      - name: Deploy da função
        run: |
          faas-cli deploy \
            --image re.giomartins.dev/${{ matrix.function }}:latest \
            --name ${{ matrix.function }} \
            --gateway ${{ secrets.OPENFAAS_URL }} \
          || faas-cli deploy \
            --image re.giomartins.dev/${{ matrix.function }}:latest \
            --name ${{ matrix.function }} \
            --gateway ${{ secrets.OPENFAAS_URL }} \
            --update