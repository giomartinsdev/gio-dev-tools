name: Deploy functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.changes.outputs.functions }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Detecta funções alteradas
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep '^functions/' \
            | cut -d'/' -f2 \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "functions=$CHANGED" >> $GITHUB_OUTPUT

  deploy:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.functions != '[]'
    strategy:
      matrix:
        function: ${{ fromJson(needs.detect-changes.outputs.functions) }}

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Login no registry
        uses: docker/login-action@v3.3.0
        with:
          registry: re.giomartins.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Escolhe Dockerfile
        id: dockerfile
        run: |
          if [ -f "functions/${{ matrix.function }}/Dockerfile" ]; then
            echo "path=functions/${{ matrix.function }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: functions/${{ matrix.function }}
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: |
            re.giomartins.dev/${{ matrix.function }}:latest
            re.giomartins.dev/${{ matrix.function }}:${{ github.sha }}

      - name: Instala faas-cli
        run: curl -sSL https://cli.openfaas.com | sudo sh

      - name: Login no faasd
        run: |
          echo ${{ secrets.OPENFAAS_PASSWORD }} | faas-cli login -s \
            --gateway ${{ secrets.OPENFAAS_URL }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Remove função existente
        run: |
          faas-cli remove ${{ matrix.function }} \
            --gateway ${{ secrets.OPENFAAS_URL }} || true
          sleep 3
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Deploy da função
        run: |
          faas-cli deploy \
            --image re.giomartins.dev/${{ matrix.function }}:${{ github.sha }} \
            --name ${{ matrix.function }} \
            --gateway ${{ secrets.OPENFAAS_URL }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Instala cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Persiste função no faasd
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.SSH_HOST }}
          proxy_port: 22
          proxy_command: cloudflared access ssh --hostname %h
          script: |
            FUNCTION="${{ matrix.function }}"
            IMAGE="re.giomartins.dev/${{ matrix.function }}:${{ github.sha }}"

            sudo python3 << PYEOF
            import yaml

            with open("/var/lib/faasd/docker-compose.yaml") as f:
                doc = yaml.safe_load(f)

            doc["services"]["$FUNCTION"] = {
                "image": "$IMAGE",
                "environment": [],
                "cap_add": ["CAP_NET_RAW"]
            }

            with open("/var/lib/faasd/docker-compose.yaml", "w") as f:
                yaml.dump(doc, f, default_flow_style=False)

            print(f"Persistido: $FUNCTION -> $IMAGE")
            PYEOF
