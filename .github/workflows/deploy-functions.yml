name: Deploy functions

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/functions/**'
      - 'src/backend/shared/**'

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      functions: ${{ steps.changes.outputs.functions }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Detect changed functions
        id: changes
        run: |
          SHARED_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -c '^src/backend/shared/' || true)
          if [ "$SHARED_CHANGED" -gt 0 ]; then
            CHANGED=$(find src/backend/functions -maxdepth 1 -mindepth 1 -type d \
              | sed 's|src/backend/functions/||' \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD \
              | grep '^src/backend/functions/' \
              | awk -F'/' 'NF >= 5' \
              | cut -d'/' -f4 \
              | grep -v '^shared$' \
              | sort -u \
              | while read fn; do [ -d "src/backend/functions/$fn" ] && echo "$fn"; done \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "functions=$CHANGED" >> $GITHUB_OUTPUT

  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.functions != '[]'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        function: ${{ fromJson(needs.detect-changes.outputs.functions) }}

    name: Deploy (${{ matrix.function }})
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check for BDD tests
        id: has-tests
        run: |
          if [ -d "src/backend/functions/${{ matrix.function }}/features" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.has-tests.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.has-tests.outputs.exists == 'true'
        run: |
          pip install \
            -r src/backend/functions/${{ matrix.function }}/requirements.txt \
            -r src/backend/functions/${{ matrix.function }}/requirements-dev.txt

      - name: Run BDD tests
        if: steps.has-tests.outputs.exists == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src/backend/functions/${{ matrix.function }}:${{ github.workspace }}/src/backend
        working-directory: src/backend/functions/${{ matrix.function }}
        run: python -m behave --no-capture --format progress2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to registry
        uses: docker/login-action@v3.3.0
        with:
          registry: re.giomartins.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve Dockerfile path
        id: dockerfile
        run: |
          if [ -f "src/backend/functions/${{ matrix.function }}/Dockerfile" ]; then
            echo "path=src/backend/functions/${{ matrix.function }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "path=src/backend/functions/Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: ${{ steps.dockerfile.outputs.path }}
          build-args: FUNCTION_DIR=${{ matrix.function }}
          push: true
          tags: |
            re.giomartins.dev/${{ matrix.function }}:latest
            re.giomartins.dev/${{ matrix.function }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.function }}
          cache-to: type=gha,mode=max,scope=${{ matrix.function }}

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.SSH_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            IdentityFile ~/.ssh/id_ed25519
          EOF

      - name: Pull image on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            sudo ctr -n openfaas-fn images pull \
              --user ${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }} \
              re.giomartins.dev/${{ matrix.function }}:latest

      - name: Remove existing function
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            faas-cli remove ${{ matrix.function }} \
              --gateway http://127.0.0.1:8080 || true

      - name: Wait for container cleanup
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'EOF'
            for i in $(seq 1 30); do
              if ! sudo ctr -n openfaas-fn containers list | grep -q "^${{ matrix.function }}"; then
                echo "Clean after ${i}s"
                break
              fi
              echo "Waiting... ${i}s"
              sleep 1
            done
          EOF

      - name: Remove stale snapshot
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            sudo ctr -n openfaas-fn snapshots rm ${{ matrix.function }}-snapshot 2>/dev/null || true

      - name: Deploy function
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            faas-cli deploy \
              --image re.giomartins.dev/${{ matrix.function }}:latest \
              --name ${{ matrix.function }} \
              --gateway http://127.0.0.1:8080 \
              --env if_id=${{ secrets.IF_ID }} \
              --env if_secret=${{ secrets.IF_SECRET }} \
              --env if_project_id=${{ secrets.IF_PROJECT_ID }} \
              --env if_env=prod \
              --env ready_timeout=30s \
              --env ready_path=/ \
              --env OTEL_EXPORTER_OTLP_ENDPOINT=https://optel.giomartins.dev \
              --env OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf \
              --env "OTEL_EXPORTER_OTLP_HEADERS=CF-Access-Client-Id=${{ secrets.CF_ACCESS_CLIENT_ID }},CF-Access-Client-Secret=${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
              --env OTEL_SERVICE_NAME=${{ matrix.function }} \
              --env OTEL_TRACES_EXPORTER=otlp \
              --env OTEL_METRICS_EXPORTER=none \
              --env OTEL_LOGS_EXPORTER=none \
              --env OTEL_PYTHON_LOG_CORRELATION=true
