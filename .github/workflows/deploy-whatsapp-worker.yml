name: Deploy whatsapp-worker

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/worker/whatsapp/**'
      - 'src/backend/shared/**'

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to registry
        uses: docker/login-action@v3.3.0
        with:
          registry: re.giomartins.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/worker/whatsapp/Dockerfile
          push: true
          tags: |
            re.giomartins.dev/whatsapp-worker:latest
            re.giomartins.dev/whatsapp-worker:${{ github.sha }}
          cache-from: type=gha,scope=whatsapp-worker
          cache-to: type=gha,mode=max,scope=whatsapp-worker

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host ${{ secrets.SSH_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            IdentityFile ~/.ssh/id_ed25519
          EOF

      - name: Pull and restart on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
          docker pull re.giomartins.dev/whatsapp-worker:latest
          docker stop whatsapp-worker 2>/dev/null || true
          docker rm whatsapp-worker 2>/dev/null || true
          IF_ID=$(docker exec dockhand sqlite3 /app/data/db/dockhand.db "SELECT value FROM stack_environment_variables WHERE stack_name='apis' AND key='IF_ID';")
          IF_SECRET=$(docker exec dockhand sqlite3 /app/data/db/dockhand.db "SELECT value FROM stack_environment_variables WHERE stack_name='apis' AND key='IF_SECRET';")
          IF_PROJECT_ID=$(docker exec dockhand sqlite3 /app/data/db/dockhand.db "SELECT value FROM stack_environment_variables WHERE stack_name='apis' AND key='IF_PROJECT_ID';")
          docker run -d \
            --name whatsapp-worker \
            --restart unless-stopped \
            --network persistence \
            -e if_id="${IF_ID}" \
            -e if_secret="${IF_SECRET}" \
            -e if_project_id="${IF_PROJECT_ID}" \
            -e if_env="prod" \
            re.giomartins.dev/whatsapp-worker:latest
          ENDSSH
