name: Deploy frontends

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      frontends: ${{ steps.changes.outputs.frontends }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Detect changed frontends
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep '^src/frontend/' \
            | cut -d'/' -f3 \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "frontends=$CHANGED" >> $GITHUB_OUTPUT

  build:
    needs: detect-changes
    runs-on: self-hosted
    if: needs.detect-changes.outputs.frontends != '[]'
    strategy:
      matrix:
        frontend: ${{ fromJson(needs.detect-changes.outputs.frontends) }}

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to registry
        uses: docker/login-action@v3.3.0
        with:
          registry: re.giomartins.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/frontend/${{ matrix.frontend }}
          push: true
          tags: |
            re.giomartins.dev/${{ matrix.frontend }}:latest
            re.giomartins.dev/${{ matrix.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.frontend }}
          cache-to: type=gha,mode=max,scope=${{ matrix.frontend }}

  deploy:
    needs: [detect-changes, build]
    runs-on: self-hosted
    if: needs.detect-changes.outputs.frontends != '[]'
    strategy:
      matrix:
        frontend: ${{ fromJson(needs.detect-changes.outputs.frontends) }}

    steps:
      - name: Trigger Dockhand redeploy
        run: |
          if [ "${{ matrix.frontend }}" = "gio-faas-dashboard" ]; then
            WEBHOOK_URL="${{ secrets.DOCKHAND_WEBHOOK }}"
          fi
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "No webhook configured for ${{ matrix.frontend }}, skipping deploy"
            exit 0
          fi
          curl -fsSL -X POST "$WEBHOOK_URL" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
