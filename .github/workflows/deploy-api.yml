name: Deploy APIs

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/api/**'

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      apis: ${{ steps.changes.outputs.apis }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Detect changed APIs
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep '^src/backend/api/' \
            | cut -d'/' -f4 \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apis=$CHANGED" >> $GITHUB_OUTPUT

  build:
    needs: detect-changes
    runs-on: self-hosted
    if: needs.detect-changes.outputs.apis != '[]'
    strategy:
      matrix:
        api: ${{ fromJson(needs.detect-changes.outputs.apis) }}

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to registry
        uses: docker/login-action@v3.3.0
        with:
          registry: re.giomartins.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/api/${{ matrix.api }}/Dockerfile
          push: true
          tags: |
            re.giomartins.dev/${{ matrix.api }}:latest
            re.giomartins.dev/${{ matrix.api }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.api }}
          cache-to: type=gha,mode=max,scope=${{ matrix.api }}

  deploy:
    needs: [detect-changes, build]
    runs-on: self-hosted
    if: needs.detect-changes.outputs.apis != '[]'
    strategy:
      matrix:
        api: ${{ fromJson(needs.detect-changes.outputs.apis) }}

    steps:
      - name: Trigger Dockhand redeploy
        run: |
          if [ "${{ matrix.api }}" = "gateway" ]; then
            WEBHOOK_URL="${{ secrets.DOCKHAND_WEBHOOK }}"
          fi
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "No webhook configured for ${{ matrix.api }}, skipping deploy"
            exit 0
          fi
          curl -fsSL -X POST "$WEBHOOK_URL" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
