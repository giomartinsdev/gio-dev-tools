name: Deploy APIs

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/api/**'
      - 'src/backend/shared/**'

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      apis: ${{ steps.changes.outputs.apis }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Detect changed APIs
        id: changes
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          SHARED_CHANGED=$(git diff --name-only "$BASE" HEAD | grep -c '^src/backend/shared/' || true)
          if [ "$SHARED_CHANGED" -gt 0 ]; then
            CHANGED=$(find src/backend/api -maxdepth 1 -mindepth 1 -type d \
              | sed 's|src/backend/api/||' \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            CHANGED=$(git diff --name-only "$BASE" HEAD \
              | grep '^src/backend/api/' \
              | cut -d'/' -f4 \
              | sort -u \
              | while read api; do [ -d "src/backend/api/$api" ] && echo "$api"; done \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "apis=$CHANGED" >> $GITHUB_OUTPUT

  build:
    needs: detect-changes
    runs-on: self-hosted
    if: needs.detect-changes.outputs.apis != '[]'
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJson(needs.detect-changes.outputs.apis) }}

    name: Build (${{ matrix.api }})
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check for BDD tests
        id: has-tests
        run: |
          if [ -d "src/backend/api/${{ matrix.api }}/features" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.has-tests.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.has-tests.outputs.exists == 'true'
        run: |
          pip install \
            -r src/backend/api/${{ matrix.api }}/requirements.txt \
            -r src/backend/api/${{ matrix.api }}/requirements-dev.txt

      - name: Run BDD tests
        if: steps.has-tests.outputs.exists == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/src/backend/api/${{ matrix.api }}:${{ github.workspace }}/src/backend
        working-directory: src/backend/api/${{ matrix.api }}
        run: python -m behave --no-capture --format progress2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to registry
        uses: docker/login-action@v3.3.0
        with:
          registry: re.giomartins.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/api/${{ matrix.api }}/Dockerfile
          push: true
          tags: |
            re.giomartins.dev/${{ matrix.api }}:latest
            re.giomartins.dev/${{ matrix.api }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.api }}
          cache-to: type=gha,mode=max,scope=${{ matrix.api }}

  deploy:
    needs: [detect-changes, build]
    runs-on: self-hosted
    if: needs.detect-changes.outputs.apis != '[]'

    name: Deploy (trigger Dockhand)
    steps:
      - name: Trigger Dockhand redeploy
        run: |
          WEBHOOK_URL="${{ secrets.DOCKHAND_WEBHOOK }}"
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "No webhook configured, skipping deploy"
            exit 0
          fi
          curl -fsSL -X POST "$WEBHOOK_URL" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
