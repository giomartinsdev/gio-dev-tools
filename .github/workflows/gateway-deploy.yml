name: Deploy gateway

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3.3.0
        with:
          registry: re.giomartins.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Dockerfile
          push: true
          tags: |
            re.giomartins.dev/gateway:latest
            re.giomartins.dev/gateway:${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dockhand redeploy
        run: |
          curl -fsSL -X POST "${{ secrets.DOCKHAND_GATEWAY_WEBHOOK }}" \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
